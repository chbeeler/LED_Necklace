; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/post_build_uf2.py
;debug_tool = jlink
;upload_protocol = jlink

lib_deps =
  seeed-studio/Seeed Arduino LSM6DS3@^2.0.5
  adafruit/Adafruit SPIFlash@5.1.1
  adafruit/SdFat - Adafruit Fork@^2.3.0

build_flags =
  -Ilib/nrfxlib_nfc/include
  -Llib/nrfxlib_nfc/precompiled/cortex-m4/hard-float
  -Wl,--whole-archive
  -lnfct2t
  -Wl,--no-whole-archive