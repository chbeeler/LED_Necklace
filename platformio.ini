; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
lib_deps =
  seeed-studio/Seeed Arduino LSM6DS3@^2.0.5
  adafruit/Adafruit SPIFlash@5.1.1
  adafruit/SdFat - Adafruit Fork@^2.3.0

nfc_build_flags =
  -Ilib/nrfxlib_nfc/include
  -Llib/nrfxlib_nfc/precompiled/cortex-m4/hard-float
  -DENABLE_NFC=1
  -DNRFX_NFCT_ENABLED=1
  -DNRFX_NFCT_DEFAULT_CONFIG_IRQ_PRIORITY=7
  -DNRFX_NFCT_CONFIG_IRQ_PRIORITY=7
  -DNRFX_NFCT_CONFIG_LOG_ENABLED=0
  -DUSE_WORKAROUND_FOR_ANOMALY_190=0
  -Wl,--whole-archive
  -lnfc_t2t
  -Wl,--no-whole-archive

normal_build_src_filter =
  +<*>
  -<analog_mic_test.cpp>

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/post_build_uf2.py
;debug_tool = jlink
;upload_protocol = jlink

lib_deps = ${common.lib_deps}

build_flags = ${common.nfc_build_flags}
build_src_filter = ${common.normal_build_src_filter}

[env:seeed_xiao_nrf52840_sense_no_nfc]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/post_build_uf2.py
;debug_tool = jlink
;upload_protocol = jlink

lib_deps = ${common.lib_deps}
lib_ignore = nrfxlib_nfc

build_flags =
  -DENABLE_NFC=0
build_src_filter = ${common.normal_build_src_filter}

; Minimal firmware path for evaluating an analog microphone on A1 / P0.03.
; Build/upload this environment explicitly; the normal environments above are
; unaffected.
[env:analog_mic_a2_test]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 921600
extra_scripts = post:scripts/post_build_uf2.py
build_src_filter =
  -<*>
  +<analog_mic_test.cpp>
